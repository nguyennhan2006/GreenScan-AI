# Kho tri thức nền GreenScan, v1 (14/11/2026)
#
# Đây là TRI THỨC NỀN để giải thích cho người dùng, KHÔNG phải bằng chứng của doanh nghiệp.
# Không module kiểm chứng / truy xuất / tác tử nào được đọc tệp này (tests/test_architecture_invariants.py).
# Vụ việc và văn bản pháp lý không chép ở đây: loader nạp thẳng từ data/real_cases/cases/*/case.json
# và configs/legal/LEGAL_SOURCE_REGISTRY.yaml để chỉ có một nguồn.
#
# Trường của một mục (xem data/domain_kb/README.md):
#   id, kind (concept | signal | formula | pattern), title, summary            bắt buộc
#   claim_good   claim chuẩn: câu nêu đủ thuộc tính, kiểm được
#   claim_weak   cùng ý nhưng thiếu thuộc tính / có dấu hiệu rủi ro
#   attributes   thuộc tính bắt buộc phải có trong claim
#   evidence     bằng chứng cần tìm và tìm ở đâu
#   signals      id các mục dấu hiệu liên quan
#   method       cách tính / cách kiểm (lời)
#   code         hàm thật trong code làm phép tính đó ("module:hàm"), kiểm thử bắt hàm phải tồn tại
#   check        ví dụ số kiểm được: biểu thức số học + kết quả mong đợi (kiểm thử tính lại)
#   system       sản phẩm hiện làm gì với loại này
#   codes        mã của hệ thống liên quan (lý do so sánh, kết luận) để tra theo mã
#   keywords     từ khoá tra cứu (Việt + Anh)
#   related      id mục liên quan
#   sources      nguồn [NGOÀI] hoặc [KIẾN THỨC NỀN]; người duyệt kiểm lại trước khi đổi review_status

defaults:
  labeler: claude-opus-5-5
  review_status: pending_human_review
  created: "2026-11-14"

entries:

# ============================================================== KHÁI NIỆM
- id: C-GHG-SCOPES
  kind: concept
  title: Phạm vi phát thải 1, 2, 3
  summary: >-
    Phạm vi 1 là phát thải trực tiếp từ nguồn doanh nghiệp sở hữu hoặc kiểm soát (lò, xe, quá trình).
    Phạm vi 2 là phát thải gián tiếp từ điện, hơi, nhiệt mua về. Phạm vi 3 là phát thải gián tiếp khác
    trong chuỗi giá trị, chia 15 hạng mục (hàng hoá mua vào, vận chuyển, sử dụng sản phẩm đã bán...).
    ISO 14064-1:2018 chia thành 6 loại thay cho 3 phạm vi nhưng ý tương ứng.
  attributes: [phạm vi phát thải]
  method: >-
    Hai con số chỉ so được khi cùng phạm vi. "Phạm vi 1+2" không so với "phạm vi 1". Tổng phạm vi
    1+2(+3) phải bằng tổng các thành phần đã công bố.
  code: ["quantum_gw.verification.numeric_facts:eligibility", "quantum_gw.verification.irlib:comparable"]
  system: Khác phạm vi khi cả hai bên đều nêu rõ thì hệ thống không so (different_scope), không bao giờ kết luận mâu thuẫn.
  codes: [different_scope]
  keywords: [scope 1, scope 2, scope 3, phạm vi 1, phạm vi 2, phạm vi 3, phát thải trực tiếp, gián tiếp, chuỗi giá trị, value chain, iso 14064]
  related: [C-SCOPE2-METHODS, F-SCOPE-SUM, SIG-SCOPE-OMISSION]
  sources:
    - "[NGOÀI] GHG Protocol Corporate Accounting and Reporting Standard, bản sửa đổi 2004, chương 4"
    - "[NGOÀI] GHG Protocol Corporate Value Chain (Scope 3) Standard, 2011"
    - "[NGOÀI] ISO 14064-1:2018"

- id: C-SCOPE2-METHODS
  kind: concept
  title: Phạm vi 2 theo vị trí và theo thị trường
  summary: >-
    Theo vị trí (location-based) dùng hệ số phát thải trung bình của lưới điện nơi tiêu thụ. Theo thị
    trường (market-based) dùng hệ số của hợp đồng doanh nghiệp chọn mua: chứng chỉ năng lượng tái tạo
    (REC, I-REC), hợp đồng mua bán điện trực tiếp (PPA). Hướng dẫn Phạm vi 2 của GHG Protocol yêu cầu
    báo cáo cả hai. Mua chứng chỉ chỉ giảm số theo thị trường, không giảm số theo vị trí.
  method: Không cộng hay so số theo vị trí với số theo thị trường. Claim "giảm phát thải nhờ điện xanh" phải nói rõ cách tính nào.
  system: Hai cách tính là hai biến thể của cùng chỉ số; khác biến thể thì không so (different_variant).
  codes: [different_variant]
  keywords: [location-based, market-based, theo vị trí, theo thị trường, rec, i-rec, ppa, chứng chỉ năng lượng tái tạo, hệ số lưới điện, grid emission factor]
  related: [C-GHG-SCOPES, C-OFFSET-VS-REC, P-RE-SHARE]
  sources:
    - "[NGOÀI] GHG Protocol Scope 2 Guidance, 2015"

- id: C-ORG-BOUNDARY
  kind: concept
  title: Ranh giới tổ chức (tập đoàn, công ty mẹ, nhà máy)
  summary: >-
    Ranh giới tổ chức quyết định số liệu của những đơn vị nào được gộp vào: theo tỷ lệ vốn góp, theo
    kiểm soát tài chính, hoặc theo kiểm soát hoạt động. Cùng một chỉ số có thể khác hàng chục lần giữa
    toàn tập đoàn và một nhà máy. Báo cáo phải nói rõ cách gộp và danh sách đơn vị.
  attributes: [ranh giới tổ chức]
  evidence: ["Mục 'phạm vi báo cáo' / 'giới thiệu báo cáo' liệt kê đơn vị được gộp", "Thuyết minh phương pháp kiểm kê"]
  method: Hai con số chỉ so được khi cùng ranh giới. Chênh lệch từ 20 lần trở lên khi một bên không nêu ranh giới, hoặc từ 100 lần trở lên trong mọi trường hợp, thường là do khác ranh giới; cần người xem.
  code: ["quantum_gw.verification.numeric_facts:eligibility"]
  check:
    - {expr: "23474480 / 90846", expect: 258.4, tol: 0.1, note: "phát thải tập đoàn so với một nhà máy: gấp khoảng 258 lần, vượt ngưỡng 100"}
  system: Khác ranh giới thì không so (different_boundary); chênh lệch lớn bất thường thì chuyển người (magnitude_gap).
  codes: [different_boundary, magnitude_gap]
  keywords: [ranh giới, boundary, tập đoàn, hợp nhất, công ty mẹ, công ty con, nhà máy, cơ sở, equity share, operational control, financial control, kiểm soát hoạt động]
  related: [SIG-BOUNDARY-CHERRY]
  sources:
    - "[NGOÀI] GHG Protocol Corporate Standard, chương 3"
    - "[ĐÃ THỰC NGHIỆM] Lượt chạy nền Hòa Phát 22/09/2026: 5/8 kết luận mâu thuẫn sai do so khác ranh giới / cơ sở đo (docstring numeric_facts.py)"

- id: C-BASE-YEAR
  kind: concept
  title: Năm gốc và tính lại năm gốc
  summary: >-
    Năm gốc là mốc để đo mức giảm. Khi cơ cấu doanh nghiệp đổi đáng kể (sáp nhập, mua lại, thoái vốn,
    thuê ngoài) hoặc đổi phương pháp tính, GHG Protocol yêu cầu tính lại số năm gốc theo ngưỡng trọng
    yếu doanh nghiệp tự đặt, và công bố lý do. Không có năm gốc thì "giảm X%" không kiểm được.
  attributes: [năm gốc, kỳ]
  method: Mức giảm luôn tính so với số năm gốc cùng ranh giới, cùng phương pháp. Nếu năm gốc đã tính lại, dùng số đã tính lại.
  system: 'Thiếu năm gốc là một trong năm thuộc tính bắt buộc; claim_attributes báo "còn thiếu: năm gốc".'
  keywords: [năm gốc, base year, baseline, tính lại năm gốc, recalculation, năm cơ sở]
  related: [SIG-NO-BASELINE, SIG-BASE-YEAR-SHIFT, F-PCT-CHANGE]
  sources:
    - "[NGOÀI] GHG Protocol Corporate Standard, chương 5"

- id: C-ABS-VS-INTENSITY
  kind: concept
  title: Số tuyệt đối, cường độ, tỷ trọng, mức thay đổi
  summary: >-
    Cùng là "%" nhưng có thể là bốn thứ khác nhau: số tuyệt đối (tCO2e), cường độ (tCO2e trên một tấn
    sản phẩm hoặc trên một tỷ đồng doanh thu), tỷ trọng (phần của một tổng) và mức thay đổi (so với kỳ
    trước hay năm gốc). Đây là "cơ sở đo" của con số.
  method: Chỉ so hai con số cùng cơ sở đo. Cường độ giảm không có nghĩa là tổng phát thải giảm.
  code: ["quantum_gw.verification.numeric_facts:eligibility"]
  system: Khác cơ sở đo thì không so (different_basis).
  codes: [different_basis]
  keywords: [cường độ, intensity, tuyệt đối, absolute, tỷ trọng, share, mức thay đổi, cơ sở đo, basis]
  related: [F-INTENSITY, SIG-INTENSITY-MASK, F-SHARE]
  sources:
    - "[NGOÀI] GRI 305: Emissions 2016, công bố 305-4 (cường độ) và 305-5 (mức giảm)"

- id: C-TARGET-VS-ACTUAL
  kind: concept
  title: Mục tiêu và số thực hiện
  summary: >-
    Mục tiêu ("giảm 30% đến 2030") là cam kết cho tương lai; số thực hiện là kết quả đã đo của một kỳ.
    Một mục tiêu không bao giờ chứng minh một kết quả. Claim mục tiêu cần năm đích, năm gốc, phạm vi và
    lộ trình; claim thực hiện cần số đo của kỳ.
  method: Mục tiêu so với mục tiêu, thực hiện so với thực hiện. Muốn đánh giá tiến độ thì tính phần đã đạt (F-TARGET-PACE).
  code: ["quantum_gw.verification.numeric_facts:eligibility"]
  system: Một bên là mục tiêu, một bên là thực hiện thì hệ thống không kết luận, chuyển người (target_vs_actual).
  codes: [target_vs_actual]
  keywords: [mục tiêu, target, cam kết, commitment, thực hiện, actual, lộ trình, roadmap]
  related: [SIG-TARGET-AS-ACHIEVEMENT, F-TARGET-PACE, P-NETZERO-TARGET]
  sources:
    - "[KIẾN THỨC NỀN] docs/00-project/ARCHITECTURE_INVARIANTS.md, bất biến 4–6"

- id: C-NETZERO-VS-NEUTRAL
  kind: concept
  title: Net zero và trung hoà carbon
  summary: >-
    Net zero theo SBTi nghĩa là giảm sâu phát thải trên cả chuỗi giá trị (với đa số ngành là ít nhất 90%
    so với năm gốc) và chỉ trung hoà phần còn lại bằng loại bỏ carbon, thường vào năm 2050. Trung hoà
    carbon (ISO 14068-1:2023) cho phép bù bằng tín chỉ sau khi đã đo và giảm, nhưng phải công bố lượng
    bù, loại tín chỉ và kế hoạch giảm. Hai khái niệm không thay thế nhau.
  keywords: [net zero, phát thải ròng bằng 0, trung hoà carbon, carbon neutral, sbti, iso 14068, loại bỏ carbon, removal]
  related: [P-NETZERO-TARGET, P-CARBON-NEUTRAL, SIG-OFFSET-NEUTRAL]
  sources:
    - "[NGOÀI] SBTi Corporate Net-Zero Standard"
    - "[NGOÀI] ISO 14068-1:2023 Carbon neutrality"

- id: C-OFFSET-VS-REC
  kind: concept
  title: Tín chỉ carbon và chứng chỉ năng lượng tái tạo
  summary: >-
    Tín chỉ carbon (offset) là một tấn CO2e được giảm hoặc loại bỏ ở nơi khác; GHG Protocol yêu cầu báo
    cáo riêng, không trừ vào kiểm kê phạm vi 1, 2, 3. Chứng chỉ năng lượng tái tạo (REC, I-REC) chứng
    nhận một MWh điện tái tạo và chỉ ảnh hưởng phạm vi 2 theo thị trường. Cần xem mã đăng ký, năm phát
    hành (vintage) và chứng nhận đã huỷ (retirement).
  evidence: ["Chứng nhận huỷ tín chỉ / chứng chỉ có số sê-ri", "Tên chương trình đăng ký (Verra, Gold Standard, I-REC...)", "Bảng phát thải gộp và bảng tín chỉ tách riêng"]
  keywords: [tín chỉ carbon, offset, carbon credit, rec, i-rec, chứng chỉ năng lượng tái tạo, vintage, retirement, huỷ tín chỉ, bù trừ]
  related: [C-SCOPE2-METHODS, SIG-OFFSET-NEUTRAL, P-CARBON-NEUTRAL]
  sources:
    - "[NGOÀI] GHG Protocol Corporate Standard, chương 8 và 9"
    - "[NGOÀI] GHG Protocol Scope 2 Guidance, 2015"

- id: C-ASSURANCE-LEVELS
  kind: concept
  title: Đảm bảo hạn chế và đảm bảo hợp lý
  summary: >-
    Tờ đảm bảo độc lập có hai mức. Đảm bảo hạn chế (limited) kết luận dạng phủ định: "không có điều gì
    khiến chúng tôi cho rằng...". Đảm bảo hợp lý (reasonable) kết luận dạng khẳng định: "trên các khía
    cạnh trọng yếu, được trình bày trung thực...". Chuẩn mực thường gặp: ISSA 5000, ISAE 3000 (sửa đổi),
    ISAE 3410 cho khí nhà kính. Đảm bảo chỉ phủ các chỉ số và kỳ ghi trong tờ đảm bảo.
  evidence: ["Tờ đảm bảo: mức đảm bảo, chuẩn mực, danh sách chỉ số được đảm bảo, kỳ, tên đơn vị đảm bảo"]
  code: ["quantum_gw.mcp_tools:review_assurance"]
  system: Công cụ review_assurance khớp mẫu câu kết luận trong configs/issa5000_conclusion_patterns.yaml.
  keywords: [đảm bảo độc lập, assurance, limited assurance, reasonable assurance, đảm bảo hạn chế, đảm bảo hợp lý, issa 5000, isae 3000, isae 3410, kiểm toán độc lập]
  related: [P-ASSURANCE-CLAIM, SIG-NO-ASSURANCE]
  sources:
    - "[NGOÀI] IAASB ISSA 5000 General Requirements for Sustainability Assurance Engagements"
    - "[NGOÀI] ISAE 3000 (Revised), ISAE 3410"

- id: C-GREEN-BOND
  kind: concept
  title: Trái phiếu xanh và sử dụng vốn
  summary: >-
    Trái phiếu xanh là trái phiếu mà tiền thu được chỉ dùng cho dự án có lợi ích môi trường. Nguyên tắc
    Trái phiếu Xanh của ICMA có bốn cấu phần: sử dụng vốn, quy trình đánh giá và chọn dự án, quản lý tiền
    thu được, báo cáo; khuyến nghị có đánh giá độc lập. Ở Việt Nam, dự án xanh đối chiếu với danh mục phân
    loại xanh (QĐ 21/2025/QĐ-TTg).
  evidence: ["Khung trái phiếu xanh", "Ý kiến bên thứ hai (SPO)", "Báo cáo phân bổ vốn và báo cáo tác động", "Xác nhận dự án thuộc danh mục phân loại xanh"]
  keywords: [trái phiếu xanh, green bond, sử dụng vốn, use of proceeds, icma, spo, phân bổ vốn, allocation report, danh mục phân loại xanh, taxonomy]
  related: [P-GREEN-FINANCE, LEGAL-QD21-2025-QD-TTg]
  sources:
    - "[NGOÀI] ICMA Green Bond Principles, 2021 (cập nhật phụ lục 2022)"
    - "[NGOÀI] QĐ 21/2025/QĐ-TTg (xem mục pháp lý cùng mã)"

- id: C-GHG-INVENTORY-VN
  kind: concept
  title: Kiểm kê khí nhà kính bắt buộc ở Việt Nam
  summary: >-
    Nghị định 06/2022/NĐ-CP quy định giảm nhẹ phát thải khí nhà kính; cơ sở thuộc danh mục do Thủ tướng
    ban hành (hiện là QĐ 13/2024/QĐ-TTg) phải kiểm kê khí nhà kính. Nghị định 06 đã được sửa bởi
    NĐ 119/2025 và NĐ 83/2026. Kỳ kiểm kê, hạn nộp và mẫu báo cáo phải đọc từ văn bản còn hiệu lực trong
    sổ đăng ký pháp lý, không lấy từ trí nhớ.
  method: Một claim "đã kiểm kê khí nhà kính theo quy định" cần tên văn bản, năm kiểm kê, và có thể đối chiếu danh mục cơ sở.
  system: Lớp pháp lý chỉ áp quy tắc khi văn bản còn hiệu lực ở ngày xét (legal/corpus.py); quy tắc pháp lý hiện mới là bản nháp.
  keywords: [kiểm kê khí nhà kính, ghg inventory, nghị định 06, 06/2022, quyết định 13/2024, danh mục cơ sở phát thải, 119/2025, 83/2026]
  related: [LEGAL-ND06-2022-ND-CP, LEGAL-QD13-2024-QD-TTg]
  sources:
    - "[NGOÀI] configs/legal/LEGAL_SOURCE_REGISTRY.yaml (ND06-2022-ND-CP, QD13-2024-QD-TTg, ND119-2025-ND-CP, ND83-2026-ND-CP)"

- id: C-VERDICTS
  kind: concept
  title: Năm loại kết luận của GreenScan
  summary: >-
    SUPPORTED (bằng chứng ủng hộ), PARTIALLY_SUPPORTED (chỉ ủng hộ một phần), CONTRADICTED (bằng chứng so
    được và mâu thuẫn), INSUFFICIENT_EVIDENCE (chưa đủ bằng chứng), UNVERIFIABLE (claim không kiểm được,
    ví dụ quá chung chung). Kết luận là cho từng tuyên bố, không bao giờ cho cả doanh nghiệp. Chưa đủ bằng
    chứng khác với mâu thuẫn.
  system: Kết luận do luật và phép so số tất định quyết định; LLM chỉ đọc và giải thích.
  codes: [SUPPORTED, PARTIALLY_SUPPORTED, CONTRADICTED, INSUFFICIENT_EVIDENCE, UNVERIFIABLE]
  keywords: [kết luận, verdict, supported, contradicted, insufficient evidence, unverifiable, partially supported, ủng hộ, mâu thuẫn, chưa đủ bằng chứng]
  related: [C-TARGET-VS-ACTUAL]
  sources:
    - "[KIẾN THỨC NỀN] docs/00-project/ARCHITECTURE_INVARIANTS.md, bất biến 1 và 6"

# ============================================================== DẤU HIỆU
- id: SIG-VAGUE
  kind: signal
  title: Từ ngữ chung chung, không đo được
  summary: >-
    "Thân thiện môi trường", "xanh hơn", "bền vững", "hướng tới tương lai xanh" mà không nêu cơ chế, độ
    lớn, phạm vi và thời gian. Toà Amsterdam (vụ KLM 2024) coi các câu chung chung kiểu này là gây hiểu
    lầm. Từ 27/09/2026, Chỉ thị EU 2024/825 cấm tuyên bố môi trường chung chung không chứng minh được hiệu
    quả vượt trội.
  claim_weak: Chúng tôi cam kết mạnh mẽ vì một tương lai xanh hơn.
  claim_good: Năm 2024, tỷ lệ điện mặt trời tự sản xuất đạt 12% tổng điện tiêu thụ của nhà máy A (3.600/30.000 MWh).
  method: Kiểm xem câu có đủ năm thuộc tính (chỉ số, giá trị, kỳ, năm gốc nếu là thay đổi, phạm vi) không.
  code: ["quantum_gw.mcp_tools:claim_attributes"]

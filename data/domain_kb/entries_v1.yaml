# ============================================================== CÁCH TÍNH
- id: F-PCT-CHANGE
  kind: formula
  title: Phần trăm thay đổi và điểm phần trăm
  summary: >-
    Thay đổi % = (giá trị kỳ này − giá trị năm gốc) / giá trị năm gốc × 100. Âm là giảm. Khi cả hai số đã
    là tỷ lệ % thì chênh lệch tính bằng điểm phần trăm: tỷ trọng tái tạo từ 10% lên 15% là tăng 5 điểm %,
    tức tăng 50%.
  check:
    - {expr: "(70000 - 100000) / 100000 * 100", expect: -30.0, tol: 0.001, note: "100.000 → 70.000 tCO2e: giảm 30%"}
    - {expr: "(15 - 10) / 10 * 100", expect: 50.0, tol: 0.001, note: "10% → 15%: +5 điểm %, tức +50%"}
  keywords: [phần trăm thay đổi, percent change, điểm phần trăm, percentage point, giảm bao nhiêu, tăng bao nhiêu]
  related: [C-BASE-YEAR, SIG-NO-BASELINE]
  sources:
    - "[KIẾN THỨC NỀN] số học"

- id: F-INTENSITY
  kind: formula
  title: Cường độ phát thải và liên hệ với tổng
  summary: >-
    Cường độ = tổng phát thải / đại lượng hoạt động (tấn sản phẩm, MWh, tỷ đồng doanh thu). Vì tổng =
    cường độ × hoạt động, nên tổng mới / tổng cũ = (1 + thay đổi cường độ) × (1 + thay đổi hoạt động).
    Mẫu số phải cùng ranh giới và cùng kỳ với tử số.
  check:
    - {expr: "(1 - 0.10) * (1 + 0.24) - 1", expect: 0.116, tol: 0.0005, note: "cường độ −10%, sản lượng +24% → tổng +11,6%"}
    - {expr: "1900000 / 1000000", expect: 1.9, tol: 0.0001, note: "1,9 triệu tCO2e / 1 triệu tấn sản phẩm = 1,9 tCO2e/tấn"}
  code: ["quantum_gw.verification.irlib:unit_dimension"]
  system: Đơn vị cường độ giữ mẫu số ('ghg_t/tấn thép'); khác mẫu số thì khác đơn vị, không so.
  keywords: [cường độ, intensity, trên một tấn, per tonne, mẫu số, sản lượng, doanh thu]
  related: [C-ABS-VS-INTENSITY, SIG-INTENSITY-MASK]
  sources:
    - "[NGOÀI] GRI 305: Emissions 2016, công bố 305-4"

- id: F-TARGET-PACE
  kind: formula
  title: Tốc độ giảm cần thiết và tiến độ so với mục tiêu
  summary: >-
    Giảm R sau n năm thì tốc độ giảm kép mỗi năm r = 1 − (1 − R)^(1/n). Tiến độ đã đạt = (E_gốc − E_nay)
    / (E_gốc − E_đích). Dùng để hỏi "với tốc độ hiện tại có đạt mục tiêu không", không dùng để ra kết luận.
  check:
    - {expr: "1 - (1 - 0.30) ** (1 / 10)", expect: 0.0350, tol: 0.0001, note: "giảm 30% trong 10 năm → khoảng 3,5%/năm"}
    - {expr: "(100000 - 88000) / (100000 - 70000)", expect: 0.4, tol: 0.0001, note: "đã giảm 12.000 trên 30.000 cần giảm → đạt 40% chặng"}
  keywords: [tốc độ giảm, annual reduction rate, tiến độ mục tiêu, progress to target, lộ trình, cagr]
  related: [C-TARGET-VS-ACTUAL, SIG-TARGET-AS-ACHIEVEMENT, P-NETZERO-TARGET]
  sources:
    - "[KIẾN THỨC NỀN] số học"

- id: F-SHARE
  kind: formula
  title: Tỷ trọng (năng lượng tái tạo, tái chế...)
  summary: >-
    Tỷ trọng = phần / tổng × 100, phần và tổng cùng đơn vị, cùng kỳ, cùng ranh giới. Các thành phần cộng lại
    phải bằng tổng. Tỷ trọng điện tái tạo khác tỷ trọng năng lượng tái tạo trong tổng năng lượng (gồm cả
    nhiên liệu).
  check:
    - {expr: "3600 / 30000 * 100", expect: 12.0, tol: 0.001, note: "3.600 MWh điện mặt trời / 30.000 MWh điện = 12%"}
  keywords: [tỷ trọng, share, tỷ lệ năng lượng tái tạo, renewable share, phần trăm của tổng]
  related: [P-RE-SHARE, C-ABS-VS-INTENSITY]
  sources:
    - "[KIẾN THỨC NỀN] số học"

- id: F-UNIT-CONVERSION
  kind: formula
  title: Quy đổi đơn vị và bội số
  summary: >-
    Quy mọi số về đơn vị gốc trước khi so: 1 nghìn tấn CO2 = 1.000 tCO2; 1 MWh = 1.000 kWh = 3,6 GJ; 1 toe
    = 11.630 kWh; 1 TJ ≈ 277.778 kWh; 1.000 lít = 1 m3. Bội số "nghìn", "triệu", "tỷ" nhân vào giá trị;
    "tỷ lệ" không phải bội số. Số "22.540.603" là hai mươi hai triệu; "23,5" là hai mươi ba phẩy năm.
  check:
    - {expr: "1000 * 3.6 / 1000", expect: 3.6, tol: 0.0001, note: "1 MWh = 1.000 kWh × 3,6 MJ/kWh = 3,6 GJ"}
    - {expr: "41.868e9 / 3.6e6", expect: 11630.0, tol: 0.5, note: "1 toe = 41,868 GJ = 11.630 kWh"}
  code: ["quantum_gw.verification.irlib:unit_dimension", "quantum_gw.verification.irlib:parse_number"]
  system: irlib._UNITS là bảng quy đổi hệ thống dùng; khác chiều đơn vị (khối lượng với năng lượng) thì không so.
  codes: [different_unit]
  keywords: [quy đổi đơn vị, unit conversion, tco2e, mwh, gj, toe, tj, nghìn, triệu, tỷ, dấu thập phân]
  related: [SIG-UNIT-PERIOD-MISMATCH, F-TOLERANCE]
  sources:
    - "[NGOÀI] IEA, định nghĩa toe = 41,868 GJ"

- id: F-TOLERANCE
  kind: formula
  title: Dung sai khi so hai con số
  summary: >-
    Hệ thống coi hai số là khớp khi chênh lệch không vượt tổng nửa chữ số cuối mà mỗi bên đã viết. "23,5
    triệu" có dung sai 0,05 triệu = 50.000; "23.474.480" có dung sai 0,5. Nhờ vậy số làm tròn trong phần
    tóm tắt không bị coi là mâu thuẫn với số chi tiết trong bảng.
  check:
    - {expr: "abs(23.5e6 - 23474480)", expect: 25520.0, tol: 0.5, note: "chênh lệch"}
    - {expr: "0.05e6 + 0.5", expect: 50000.5, tol: 0.001, note: "dung sai; 25.520 ≤ 50.000,5 → khớp"}
  code: ["quantum_gw.verification.irlib:parse_number", "quantum_gw.verification.irlib:compare"]
  system: compare trả "|a − b| = ...; dung sai ..." trong lý do kết luận.
  keywords: [dung sai, tolerance, làm tròn, rounding, khớp số, chênh lệch]
  related: [F-UNIT-CONVERSION, F-COMPARABILITY]
  sources:
    - "[KIẾN THỨC NỀN] src/quantum_gw/verification/irlib.py"

- id: F-COMPARABILITY
  kind: formula
  title: Điều kiện để hai con số được đem so
  summary: >-
    Trước mọi phép trừ, hệ thống kiểm theo thứ tự: cùng đơn vị, cùng cơ sở đo, cùng ranh giới, cùng công
    nghệ, cùng biến thể chỉ số, cùng phạm vi phát thải, cùng là mục tiêu hoặc cùng là thực hiện, và không
    chênh nhau quá lớn (từ 20 lần khi thiếu thông tin ranh giới / cơ sở đo, từ 100 lần trong mọi trường
    hợp). Thông tin "chưa rõ" không tự chặn; chỉ khác biệt đã biết ở cả hai bên mới chặn.
  code: ["quantum_gw.verification.numeric_facts:eligibility", "quantum_gw.verification.irlib:comparable"]
  system: Một chiều khác nhau thì kết quả là không so được, không bao giờ là mâu thuẫn (bất biến 4).
  codes: [different_unit, different_basis, different_boundary, different_technology, different_variant, different_scope, target_vs_actual, magnitude_gap]
  keywords: [so được, comparable, không so được, not comparable, điều kiện so sánh, chính sách so sánh, comparison policy]
  related: [C-ORG-BOUNDARY, C-ABS-VS-INTENSITY, C-TARGET-VS-ACTUAL, C-GHG-SCOPES, F-TOLERANCE]
  sources:
    - "[KIẾN THỨC NỀN] comparison-policy-v2, src/quantum_gw/verification/numeric_facts.py"

- id: F-SCOPE-SUM
  kind: formula
  title: Cộng các phạm vi phát thải
  summary: >-
    Tổng phạm vi 1+2 = phạm vi 1 + phạm vi 2 (chọn một cách tính phạm vi 2, ghi rõ theo vị trí hay theo thị
    trường). Không cộng tín chỉ bù trừ vào kiểm kê. Nếu báo cáo ghi tổng khác tổng thành phần quá dung sai
    làm tròn thì đó là điểm cần hỏi.
  check:
    - {expr: "60000 + 10000", expect: 70000.0, tol: 0.5, note: "phạm vi 1 60.000 + phạm vi 2 10.000 = tổng 70.000 tCO2e (số minh hoạ)"}
  keywords: [cộng phạm vi, tổng phát thải, scope sum, phạm vi 1 cộng 2]
  related: [C-GHG-SCOPES, C-SCOPE2-METHODS]
  sources:
    - "[NGOÀI] GHG Protocol Corporate Standard, chương 9"

- id: F-RECYCLING-RATE
  kind: formula
  title: Tỷ lệ tái chế, tái sử dụng chất thải
  summary: >-
    Tỷ lệ tái chế = khối lượng được tái chế hoặc tái sử dụng / khối lượng chất thải phát sinh × 100. "Thu
    gom" hay "chuyển giao cho đơn vị xử lý" chưa phải là tái chế. Chất thải nguy hại tính riêng. GRI 306
    tách chất thải phát sinh, chuyển hướng khỏi tiêu huỷ và đưa đi tiêu huỷ.
  check:
    - {expr: "8200 / 10000 * 100", expect: 82.0, tol: 0.001, note: "8.200 tấn tái chế / 10.000 tấn phát sinh = 82%"}
  keywords: [tỷ lệ tái chế, recycling rate, tái sử dụng, chất thải phát sinh, chuyển hướng, diverted from disposal, chất thải nguy hại]
  related: [P-WASTE-RECYCLING, SIG-RECYCLABLE-TECHNICAL]
  sources:
    - "[NGOÀI] GRI 306: Waste 2020 (306-3, 306-4, 306-5)"

- id: F-WATER
  kind: formula
  title: Nước khai thác, xả và tiêu thụ
  summary: >-
    GRI 303 tách ba số: nước khai thác (withdrawal), nước xả (discharge) và nước tiêu thụ = khai thác − xả
    (cộng thay đổi lượng trữ nếu đáng kể). "Giảm sử dụng nước" phải nói là số nào; tuần hoàn tái sử dụng
    làm giảm khai thác nhưng không phải là nước tiêu thụ.
  check:
    - {expr: "1200000 - 950000", expect: 250000.0, tol: 0.5, note: "khai thác 1,2 triệu m3, xả 0,95 triệu m3 → tiêu thụ 250.000 m3"}
  keywords: [nước khai thác, nước tiêu thụ, water withdrawal, water consumption, nước xả, discharge, tuần hoàn nước]
  related: [P-WATER]
  sources:
    - "[NGOÀI] GRI 303: Water and Effluents 2018 (303-3, 303-4, 303-5)"

# ============================================================== CLAIM CHUẨN
- id: P-GHG-ABS-REDUCTION
  kind: pattern
  title: "Tuyên bố chuẩn: giảm tổng phát thải khí nhà kính"
  summary: Claim giảm phát thải tuyệt đối kiểm được khi nêu đủ chỉ số, giá trị, kỳ, năm gốc, phạm vi và ranh giới.
  claim_good: Năm 2024, tổng phát thải phạm vi 1 và 2 (theo vị trí) của Tập đoàn là 70.000 tCO2e, giảm 30% so với năm gốc 2019 (100.000 tCO2e).
  claim_weak: Chúng tôi đã giảm mạnh lượng phát thải carbon.
  attributes: [chỉ số, giá trị, kỳ, năm gốc, phạm vi phát thải, ranh giới tổ chức]
  evidence: ["Bảng kiểm kê khí nhà kính theo năm (năm gốc và kỳ này), cùng ranh giới", "Phương pháp và hệ số phát thải", "Tờ đảm bảo độc lập nếu có"]
  signals: [SIG-NO-BASELINE, SIG-BOUNDARY-CHERRY, SIG-SCOPE-OMISSION, SIG-BASE-YEAR-SHIFT, SIG-NO-ASSURANCE]
  method: Tính lại % giảm từ hai số trong bảng (F-PCT-CHANGE), kiểm cộng phạm vi (F-SCOPE-SUM), so với claim trong dung sai (F-TOLERANCE).
  check:
    - {expr: "(70000 - 100000) / 100000 * 100", expect: -30.0, tol: 0.001}
  system: Luật so số đối chiếu giá trị và mức thay đổi; thiếu năm gốc → claim_attributes báo thiếu.
  keywords: [giảm phát thải, emission reduction, tổng phát thải, khí nhà kính, ghg, tco2e]
  related: [F-PCT-CHANGE, F-SCOPE-SUM, C-BASE-YEAR]
  sources:
    - "[NGOÀI] GRI 305-5; GHG Protocol Corporate Standard, chương 5 và 9"

- id: P-GHG-INTENSITY
  kind: pattern
  title: "Tuyên bố chuẩn: cường độ phát thải"
  summary: Claim cường độ phải nêu mẫu số, kỳ, phạm vi, và nên kèm tổng phát thải tuyệt đối để người đọc không hiểu nhầm.
  claim_good: Cường độ phát thải phạm vi 1+2 năm 2024 là 1,90 tCO2e/tấn thép thô, giảm 4% so với 2023; tổng phát thải cùng kỳ tăng 7% do sản lượng tăng 11%.
  claim_weak: Cường độ carbon của chúng tôi giảm liên tục.
  attributes: [chỉ số, giá trị, mẫu số, kỳ, phạm vi phát thải]
  evidence: ["Tổng phát thải và sản lượng cùng kỳ, cùng ranh giới", "Định nghĩa sản lượng (thép thô, thép thành phẩm...)"]
  signals: [SIG-INTENSITY-MASK]
  method: Tính lại cường độ = tổng / sản lượng; kiểm (1 + Δcường độ)(1 + Δsản lượng) − 1 = Δtổng.
  check:
    - {expr: "(1 - 0.04) * (1 + 0.11) - 1", expect: 0.0656, tol: 0.0005, note: "khớp với 'tổng tăng khoảng 7%'"}
  code: ["quantum_gw.verification.irlib:unit_dimension"]
  keywords: [cường độ phát thải, emission intensity, tco2e trên tấn, per tonne, thép]
  related: [F-INTENSITY, C-ABS-VS-INTENSITY]
  sources:
    - "[NGOÀI] GRI 305-4"

- id: P-NETZERO-TARGET
  kind: pattern
  title: "Tuyên bố chuẩn: mục tiêu net zero"
  summary: Mục tiêu net zero đáng tin khi có năm đích, phạm vi, năm gốc, mục tiêu trung hạn, lộ trình và tiến độ hằng năm.
  claim_good: Tập đoàn đặt mục tiêu phát thải ròng bằng 0 cho phạm vi 1, 2 và 3 vào năm 2050, với mục tiêu trung hạn giảm 42% phát thải phạm vi 1+2 vào 2030 so với năm gốc 2022.
  claim_weak: Chúng tôi hướng tới net zero.
  attributes: [năm đích, phạm vi phát thải, năm gốc, mục tiêu trung hạn]
  evidence: ["Lộ trình giảm phát thải và kế hoạch đầu tư", "Số thực hiện từng năm so với đường mục tiêu", "Xác nhận mục tiêu bởi bên thứ ba (ví dụ SBTi) nếu claim nói có"]
  signals: [SIG-TARGET-AS-ACHIEVEMENT, SIG-OFFSET-NEUTRAL, SIG-SCOPE-OMISSION]
  method: Tính tốc độ giảm cần thiết và tiến độ đã đạt (F-TARGET-PACE).
  check:
    - {expr: "1 - (1 - 0.42) ** (1 / 8)", expect: 0.0658, tol: 0.0005, note: "giảm 42% trong 8 năm (2022→2030) → khoảng 6,6%/năm"}
  codes: [target_vs_actual]
  keywords: [net zero, phát thải ròng bằng 0, mục tiêu 2050, mục tiêu trung hạn, sbti, lộ trình]
  related: [C-NETZERO-VS-NEUTRAL, C-TARGET-VS-ACTUAL, F-TARGET-PACE]
  sources:
    - "[NGOÀI] SBTi Corporate Net-Zero Standard"

- id: P-CARBON-NEUTRAL
  kind: pattern
  title: "Tuyên bố chuẩn: trung hoà carbon cho sản phẩm hoặc hoạt động"
  summary: Claim trung hoà carbon phải tách lượng đo được, lượng tự giảm và lượng bù, và nêu loại tín chỉ.
  claim_good: Sự kiện X năm 2024 phát thải 1.200 tCO2e (phạm vi 1, 2 và đi lại của khách); 300 tCO2e được giảm nhờ điện mặt trời tại chỗ; 900 tCO2e còn lại được bù bằng tín chỉ Gold Standard vintage 2023, đã huỷ (số sê-ri trong phụ lục).
  claim_weak: Sản phẩm của chúng tôi trung hoà carbon.
  attributes: [đối tượng, kỳ, lượng phát thải, lượng giảm, lượng bù, loại tín chỉ]
  evidence: ["Kiểm kê dấu chân carbon của đối tượng", "Chứng nhận huỷ tín chỉ", "Chuẩn áp dụng (ví dụ ISO 14068-1)"]
  signals: [SIG-OFFSET-NEUTRAL, SIG-VAGUE]
  check:
    - {expr: "1200 - 300", expect: 900.0, tol: 0.001, note: "lượng phải bù = phát thải − lượng tự giảm"}
  keywords: [trung hoà carbon, carbon neutral, bù trừ, tín chỉ, dấu chân carbon, carbon footprint]
  related: [C-NETZERO-VS-NEUTRAL, C-OFFSET-VS-REC]
  sources:
    - "[NGOÀI] ISO 14068-1:2023; Directive (EU) 2024/825"

- id: P-RE-SHARE
  kind: pattern
  title: "Tuyên bố chuẩn: tỷ trọng năng lượng tái tạo"
  summary: Nêu tử số, mẫu số, kỳ, ranh giới và nguồn tái tạo (tự sản xuất, PPA, chứng chỉ).
  claim_good: Năm 2024, điện tái tạo chiếm 12% tổng điện tiêu thụ của nhà máy A (3.600/30.000 MWh), gồm 2.400 MWh điện mặt trời mái nhà tự sản xuất và 1.200 MWh I-REC đã huỷ.
  claim_weak: Chúng tôi sử dụng năng lượng sạch.
  attributes: [chỉ số, giá trị, tử số, mẫu số, kỳ, ranh giới tổ chức, nguồn]
  evidence: ["Số điện tiêu thụ theo hoá đơn / công tơ", "Sản lượng điện mặt trời tự sản xuất", "Chứng nhận huỷ I-REC hoặc hợp đồng PPA"]
  signals: [SIG-BOUNDARY-CHERRY, SIG-VAGUE]
  method: Tỷ trọng = phần / tổng (F-SHARE); các nguồn cộng lại bằng tử số.
  check:
    - {expr: "2400 + 1200", expect: 3600.0, tol: 0.001}
    - {expr: "3600 / 30000 * 100", expect: 12.0, tol: 0.001}
  keywords: [năng lượng tái tạo, renewable energy, điện mặt trời, tỷ trọng tái tạo, i-rec, ppa, điện xanh]
  related: [F-SHARE, C-SCOPE2-METHODS, C-OFFSET-VS-REC]
  sources:
    - "[NGOÀI] GHG Protocol Scope 2 Guidance, 2015"

- id: P-ENERGY-SAVING
  kind: pattern
  title: "Tuyên bố chuẩn: tiết kiệm năng lượng"
  summary: Lượng tiết kiệm là so với mức tiêu thụ cơ sở đã điều chỉnh theo sản lượng; cần nêu biện pháp, kỳ và phương pháp đo.
  claim_good: Dự án thu hồi nhiệt thải tại nhà máy B tiết kiệm 5.400 MWh điện năm 2024 so với mức cơ sở 2022 đã điều chỉnh theo sản lượng, đo theo phương pháp IPMVP lựa chọn B.
  claim_weak: Chúng tôi tiết kiệm năng lượng hiệu quả.
  attributes: [biện pháp, giá trị, đơn vị, kỳ, mức cơ sở, ranh giới]
  evidence: ["Số tiêu thụ trước và sau", "Báo cáo đo lường và kiểm chứng (M&V)", "Báo cáo kiểm toán năng lượng"]
  signals: [SIG-VAGUE, SIG-BOUNDARY-CHERRY]
  keywords: [tiết kiệm năng lượng, energy saving, hiệu quả năng lượng, energy efficiency, ipmvp, kiểm toán năng lượng]
  related: [F-UNIT-CONVERSION]
  sources:
    - "[NGOÀI] EVO, International Performance Measurement and Verification Protocol (IPMVP)"

- id: P-WATER
  kind: pattern
  title: "Tuyên bố chuẩn: giảm sử dụng nước"
  summary: Nói rõ là nước khai thác, nước tiêu thụ hay cường độ nước; nêu kỳ, ranh giới.
  claim_good: Năm 2024, lượng nước khai thác trên một tấn sản phẩm của các nhà máy trong nước giảm 12% so với 2023 (từ 4,25 xuống 3,74 m3/tấn).
  claim_weak: Chúng tôi sử dụng nước tiết kiệm.
  attributes: [chỉ số, giá trị, đơn vị, kỳ, ranh giới]
  evidence: ["Bảng nước khai thác / xả / tiêu thụ theo năm", "Sản lượng cùng kỳ"]
  signals: [SIG-INTENSITY-MASK, SIG-VAGUE]
  check:
    - {expr: "(3.74 - 4.25) / 4.25 * 100", expect: -12.0, tol: 0.05}
  keywords: [nước, water, nước khai thác, tiêu thụ nước, cường độ nước, tiết kiệm nước]
  related: [F-WATER, F-INTENSITY]
  sources:
    - "[NGOÀI] GRI 303: Water and Effluents 2018"

- id: P-WASTE-RECYCLING
  kind: pattern
  title: "Tuyên bố chuẩn: tái chế, tái sử dụng chất thải"
  summary: Nêu loại chất thải, khối lượng phát sinh, khối lượng tái chế, kỳ; tách chất thải nguy hại.
  claim_good: Năm 2024, 82% chất thải rắn công nghiệp thông thường của nhà máy C được tái chế hoặc tái sử dụng (8.200/10.000 tấn); chất thải nguy hại 120 tấn được chuyển giao cho đơn vị có giấy phép xử lý.
  claim_weak: Chúng tôi tái chế phần lớn chất thải.
  attributes: [loại chất thải, khối lượng phát sinh, khối lượng tái chế, kỳ, ranh giới]
  evidence: ["Sổ theo dõi chất thải / biên bản chuyển giao", "Giấy phép của đơn vị tái chế, xử lý"]
  signals: [SIG-RECYCLABLE-TECHNICAL, SIG-VAGUE]
  check:
    - {expr: "8200 / 10000 * 100", expect: 82.0, tol: 0.001}
  keywords: [tái chế, recycling, chất thải, waste, tái sử dụng, chất thải nguy hại, hazardous waste]
  related: [F-RECYCLING-RATE]
  sources:
    - "[NGOÀI] GRI 306: Waste 2020"

- id: P-RECYCLABLE-PRODUCT
  kind: pattern
  title: "Tuyên bố chuẩn: sản phẩm, bao bì có thể tái chế"
  summary: Phải nói tái chế được ở đâu, bởi hệ thống nào, và tỷ lệ thực tế được thu hồi; không giấu phản hồi bất lợi của bên tái chế.
  claim_good: 100% bao bì PET của dòng sản phẩm D có thể tái chế qua hệ thống thu gom của đối tác E tại Hà Nội và TP.HCM; năm 2024 thu hồi được 35% lượng bao bì đưa ra thị trường.
  claim_weak: Bao bì của chúng tôi 100% có thể tái chế.
  attributes: [sản phẩm, vật liệu, khu vực, hệ thống thu gom, tỷ lệ thu hồi thực tế]
  evidence: ["Xác nhận của đơn vị thu gom, tái chế", "Số liệu thu hồi thực tế", "Trách nhiệm mở rộng của nhà sản xuất (EPR) đã thực hiện"]
  signals: [SIG-RECYCLABLE-TECHNICAL, SIG-OMISSION]
  keywords: [có thể tái chế, recyclable, bao bì, packaging, thu hồi, epr]
  related: [CASE-KDP-2024, F-RECYCLING-RATE]
  sources:
    - "[NGOÀI] SEC order Keurig Dr Pepper, 2024; UK CMA Green Claims Code, 2021"

- id: P-ECO-PRODUCT
  kind: pattern
  title: "Tuyên bố chuẩn: sản phẩm \"thân thiện môi trường\""
  summary: Thay nhãn chung chung bằng thuộc tính đo được trên vòng đời, hoặc nhãn sinh thái được cấp bởi bên thứ ba có tên và số chứng nhận.
  claim_good: Sơn F đạt Nhãn Xanh Việt Nam (số chứng nhận ..., hiệu lực đến 2027) và có hàm lượng VOC dưới 30 g/L.
  claim_weak: Sản phẩm thân thiện với môi trường.
  attributes: [thuộc tính môi trường, giá trị, chứng nhận / chuẩn đo]
  evidence: ["Chứng nhận nhãn sinh thái còn hiệu lực", "Kết quả thử nghiệm hoặc đánh giá vòng đời (LCA)"]
  signals: [SIG-VAGUE, SIG-IRRELEVANT]
  keywords: [thân thiện môi trường, eco-friendly, nhãn sinh thái, nhãn xanh việt nam, ecolabel, vòng đời, lca]
  related: [SIG-VAGUE, CASE-KLM-2024]
  sources:
    - "[NGOÀI] Directive (EU) 2024/825; UK CMA Green Claims Code, 2021"
    - "[NGOÀI] Luật Bảo vệ môi trường 2020 (nhãn sinh thái Việt Nam)"

- id: P-ISO14001
  kind: pattern
  title: "Tuyên bố chuẩn: chứng nhận ISO 14001"
  summary: ISO 14001 chứng nhận hệ thống quản lý môi trường, không chứng nhận kết quả môi trường. Claim cần phạm vi chứng nhận và hiệu lực.
  claim_good: 6/8 nhà máy trong nước được chứng nhận ISO 14001:2015 bởi tổ chức G, hiệu lực đến 2026; hai nhà máy mới đang trong quá trình đánh giá.
  claim_weak: Chúng tôi đạt chuẩn quốc tế về môi trường.
  attributes: [chuẩn, phạm vi chứng nhận, tổ chức chứng nhận, hiệu lực]
  evidence: ["Giấy chứng nhận: số, phạm vi địa điểm, ngày hết hạn"]
  signals: [SIG-BOUNDARY-CHERRY, SIG-IRRELEVANT]
  keywords: [iso 14001, hệ thống quản lý môi trường, ems, chứng nhận, certification]
  related: [P-ASSURANCE-CLAIM]
  sources:
    - "[NGOÀI] ISO 14001:2015"

- id: P-GREEN-FINANCE
  kind: pattern
  title: "Tuyên bố chuẩn: trái phiếu xanh, tín dụng xanh"
  summary: Nêu số tiền, công cụ, danh mục dự án, tỷ lệ đã phân bổ, tác động đo được và đánh giá độc lập.
  claim_good: Năm 2024 phát hành 1.000 tỷ đồng trái phiếu xanh theo khung trái phiếu xanh có ý kiến bên thứ hai của H; đã phân bổ 800 tỷ (80%) cho hai dự án điện mặt trời thuộc danh mục phân loại xanh, ước tính tránh 45.000 tCO2e/năm.
  claim_weak: Chúng tôi tiên phong tài chính xanh.
  attributes: [công cụ, số tiền, dự án, tỷ lệ phân bổ, tác động, đánh giá độc lập]
  evidence: ["Khung trái phiếu xanh và SPO", "Báo cáo phân bổ và tác động", "Đối chiếu dự án với QĐ 21/2025/QĐ-TTg"]
  signals: [SIG-VAGUE, SIG-POLICY-NOT-PRACTICE]
  check:
    - {expr: "800 / 1000 * 100", expect: 80.0, tol: 0.001}
  keywords: [trái phiếu xanh, green bond, tín dụng xanh, green loan, phân bổ vốn, danh mục phân loại xanh]
  related: [C-GREEN-BOND, LEGAL-QD21-2025-QD-TTg, LEGAL-TT17-2022-TT-NHNN]
  sources:
    - "[NGOÀI] ICMA Green Bond Principles; QĐ 21/2025/QĐ-TTg; TT 17/2022/TT-NHNN"

- id: P-ESG-INTEGRATION
  kind: pattern
  title: "Tuyên bố chuẩn: đánh giá rủi ro môi trường / tích hợp ESG"
  summary: Claim về quy trình phải có số bao phủ thực tế và kiểm soát, không chỉ có chính sách.
  claim_good: Năm 2024, 96% dư nợ (theo giá trị) của các khoản vay mới thuộc ngành rủi ro môi trường cao đã được đánh giá rủi ro môi trường theo Thông tư 17/2022/TT-NHNN; 4% còn lại đang bổ sung hồ sơ.
  claim_weak: Mọi quyết định cấp tín dụng của chúng tôi đều tích hợp yếu tố môi trường.
  attributes: [quy trình, tỷ lệ bao phủ, kỳ, phạm vi danh mục]
  evidence: ["Số khoản / giá trị đã đánh giá trên tổng", "Kiểm soát nội bộ, kiểm toán nội bộ về quy trình"]
  signals: [SIG-POLICY-NOT-PRACTICE]
  keywords: [tích hợp esg, esg integration, đánh giá rủi ro môi trường, quản lý rủi ro môi trường, tín dụng, thông tư 17]
  related: [CASE-BNY-2022, CASE-DWS-2023, LEGAL-TT17-2022-TT-NHNN]
  sources:
    - "[NGOÀI] TT 17/2022/TT-NHNN; SEC orders BNY Mellon 2022, DWS 2023"

- id: P-TREES
  kind: pattern
  title: "Tuyên bố chuẩn: trồng cây, phục hồi rừng"
  summary: Nêu số cây hoặc diện tích, địa điểm, năm, tỷ lệ sống; trồng cây không tự động là bù phát thải.
  claim_good: Năm 2024 trồng 12.000 cây keo và lim trên 10 ha rừng phòng hộ tại tỉnh K, tỷ lệ sống sau 12 tháng 85% theo biên bản nghiệm thu của Ban quản lý rừng.
  claim_weak: Chúng tôi trồng hàng nghìn cây xanh để bảo vệ hành tinh.
  attributes: [số cây / diện tích, địa điểm, kỳ, tỷ lệ sống]
  evidence: ["Biên bản nghiệm thu", "Bản đồ / toạ độ", "Không quy đổi sang tCO2e nếu không có phương pháp được công nhận"]
  signals: [SIG-OFFSET-NEUTRAL, SIG-VAGUE]
  keywords: [trồng cây, trees, trồng rừng, reforestation, diện tích xanh, tỷ lệ sống]
  related: [SIG-OFFSET-NEUTRAL, CASE-KLM-2024]
  sources:
    - "[NGOÀI] Phán quyết Toà Amsterdam vụ KLM, 20/03/2024 (data/real_cases/cases/KLM-2024)"

- id: P-ASSURANCE-CLAIM
  kind: pattern
  title: "Tuyên bố chuẩn: số liệu đã được đảm bảo độc lập"
  summary: Nêu đơn vị đảm bảo, mức đảm bảo, chuẩn mực, chỉ số và kỳ được đảm bảo.
  claim_good: Số liệu phát thải phạm vi 1 và 2 năm 2024 được đảm bảo hạn chế bởi công ty L theo ISAE 3410 (xem tờ đảm bảo trang 120).
  claim_weak: Báo cáo đã được kiểm toán độc lập.
  attributes: [đơn vị đảm bảo, mức đảm bảo, chuẩn mực, chỉ số, kỳ]
  evidence: ["Tờ đảm bảo đầy đủ"]
  signals: [SIG-NO-ASSURANCE]
  code: ["quantum_gw.mcp_tools:review_assurance"]
  keywords: [đảm bảo độc lập, assurance, kiểm toán độc lập, isae 3410, issa 5000, tờ đảm bảo]
  related: [C-ASSURANCE-LEVELS]
  sources:
    - "[NGOÀI] IAASB ISSA 5000; ISAE 3410"

- id: P-COMPLIANCE
  kind: pattern
  title: "Tuyên bố chuẩn: tuân thủ quy chuẩn môi trường"
  summary: Tuân thủ là nghĩa vụ; claim nên nêu quy chuẩn, chỉ tiêu, kết quả quan trắc và các vi phạm (nếu có) trong kỳ.
  claim_good: Năm 2024, 4/4 đợt quan trắc nước thải tại nhà máy M đạt QCVN 40:2011/BTNMT cột A; không có quyết định xử phạt vi phạm hành chính về môi trường trong năm.
  claim_weak: Chúng tôi tuân thủ 100% pháp luật môi trường.
  attributes: [quy chuẩn, chỉ tiêu, kỳ, kết quả quan trắc, vi phạm]
  evidence: ["Báo cáo quan trắc định kỳ", "Tra cứu quyết định xử phạt của cơ quan quản lý"]
  signals: [SIG-IRRELEVANT, SIG-OMISSION]
  keywords: [tuân thủ, compliance, quy chuẩn, qcvn, quan trắc, xử phạt, nước thải]
  related: [SIG-IRRELEVANT, LEGAL-LUAT-BVMT-2020]
  sources:
    - "[NGOÀI] Luật Bảo vệ môi trường 2020; QCVN 40:2011/BTNMT"

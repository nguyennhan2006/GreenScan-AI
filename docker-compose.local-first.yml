# Local-first stack for v1.1 (docs/decisions/0002-local-first-model-gateway.md).
#
#   docker compose -f docker-compose.local-first.yml up --build              # api + postgres + redis + minio
#   docker compose -f docker-compose.local-first.yml --profile gpu up       # + vllm + embedding + reranker (needs NVIDIA GPU)
#
# vLLM/TEI ports are NOT published to the host on purpose: only the backend
# may call the model servers. Never expose vllm:8000 to the Internet.

services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Values from .env win; these defaults target the gpu-profile services.
      LOCAL_LLM_PROVIDER: ${LOCAL_LLM_PROVIDER:-openai_compatible}
      LOCAL_LLM_BASE_URL: ${LOCAL_LLM_BASE_URL:-http://vllm:8000/v1}
      LOCAL_LLM_MODEL: ${LOCAL_LLM_MODEL:-Qwen/Qwen3-8B}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-http}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://embedding:80}
      RERANKER_PROVIDER: ${RERANKER_PROVIDER:-http}
      RERANKER_BASE_URL: ${RERANKER_BASE_URL:-http://reranker:80}
      DATABASE_URL: postgresql://quantum:quantum@postgres:5432/quantum
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
    volumes:
      - ./configs:/app/configs:ro
      - ./data:/app/data:ro
      - ./.quantum:/app/.quantum
    depends_on:
      - postgres
      - redis
      - minio

  # Async job worker (planned): will consume analysis jobs from Redis once the
  # queue module lands. Kept here so the target topology is explicit.
  # worker:
  #   build: .
  #   command: quantum-agent worker
  #   env_file: [.env]
  #   depends_on: [redis, postgres]

  vllm:
    image: vllm/vllm-openai:latest
    profiles: ["gpu"]
    command: >
      --model Qwen/Qwen3-8B
      --host 0.0.0.0
      --port 8000
      --max-model-len 32768
    volumes:
      - hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  embedding:
    image: ghcr.io/huggingface/text-embeddings-inference:latest
    profiles: ["gpu"]
    command: --model-id BAAI/bge-m3 --max-batch-tokens 16384
    volumes:
      - hf-cache:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  reranker:
    image: ghcr.io/huggingface/text-embeddings-inference:latest
    profiles: ["gpu"]
    command: --model-id BAAI/bge-reranker-v2-m3 --max-batch-tokens 16384
    volumes:
      - hf-cache:/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quantum
      POSTGRES_PASSWORD: quantum
      POSTGRES_DB: quantum
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: quantum
      MINIO_ROOT_PASSWORD: quantum-secret
    ports:
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  hf-cache:
  postgres-data:
  redis-data:
  minio-data:

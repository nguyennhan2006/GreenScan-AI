[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-quantum-greenwashing-agent"
version = "1.1.0"
description = "Evidence-first AI agent baseline for greenwashing-risk analysis in Vietnamese finance"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "AI Quantum Project Team"}]
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
  "typer>=0.12,<1",
  "PyYAML>=6,<7",
  "httpx>=0.27,<1",
  "PyMuPDF>=1.24,<2",
  "pdfplumber>=0.11,<1",
  "python-multipart>=0.0.9,<1",
  "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
# tools/make_data_fields_pdf.py builds the customer-facing data-field guide.
docs = [
  "reportlab>=4,<6",
  "cairosvg>=2.7,<3",
]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.5,<1",
  "mypy>=1.10,<2",
  "build>=1.2,<2",
]
# tools/crawl_*.py and tools/verify_regressions.py import the crawler stack;
# tests/test_cli_smoke.py exercises them, so `pip install -e ".[dev,crawl]"`
# is what makes the full suite green.
crawl = [
  "beautifulsoup4>=4.12,<5",
  "lxml>=5,<7",
  "tenacity>=9,<10",
  "requests>=2.31,<3",
  "openpyxl>=3.1,<4",
  "python-docx>=1.1,<2",
  "pypdf>=5,<7",
  "rapidfuzz>=3.9,<4",
  "pandas>=2.2,<3",
  "rich>=13.7,<15",
]

[project.scripts]
quantum-agent = "quantum_gw.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/quantum_gw/api.py" = ["B008"]
"src/quantum_gw/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true

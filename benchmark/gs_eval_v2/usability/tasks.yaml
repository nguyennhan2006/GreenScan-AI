cau_hoi:   # văn bản chuẩn, PROTOCOL.md tham chiếu tới đây
  SEQ: "Nhìn chung, nhiệm vụ này khó hay dễ? (1 = Rất khó … 7 = Rất dễ)"
  NT1: "Tôi hiểu vì sao GreenScan đưa ra kết luận / gợi ý này. (1–7)"
  NT2: "Tôi kiểm lại được kết luận này từ tài liệu gốc. (1–7)"
  NT3: "Tôi sẵn sàng ghi kết luận này vào giấy làm việc mà không kiểm lại. (1–7; điểm cao khi bằng chứng yếu = tin quá mức)"
  NT4: "Tôi biết phần nào do luật hoặc máy làm, phần nào do người quyết. (1–7)"
  KH1: {cau: "Tuyên bố “chưa đủ bằng chứng” nghĩa là doanh nghiệp đã nói sai.", dap_an: Sai}
  KH2: {cau: "Thứ tự trong hàng đợi cho biết tuyên bố nào “xấu” nhất.", dap_an: Sai}
  KH3: {cau: "Một tuyên bố “ủng hộ một phần” vẫn có thể đúng.", dap_an: Đúng}
  KH4: {cau: "Độ phủ kho tài liệu 75 % đủ để kết luận là không có bằng chứng.", dap_an: Sai}
  KH5: {cau: "Quy tắc nội bộ của tổ chức có thể đổi kết luận kiểm chứng của GreenScan.", dap_an: Sai}
  KH6: {cau: "Gợi ý sửa của GreenScan có thể tự điền số liệu mới vào câu.", dap_an: Sai}

cham_chung: "Mỗi nhiệm vụ chấm 1 (đạt, không trợ giúp) / 0,5 (một phần) / 0 (trượt). Quá thoi_gian_toi_da_giay hoặc người điều phối phải chỉ đường thì tối đa 0,5. Lỗi nghiêm trọng thì 0."


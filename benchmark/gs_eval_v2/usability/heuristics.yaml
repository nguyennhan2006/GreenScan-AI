# D-UX · Bộ nguyên tắc đánh giá chuyên gia (heuristic evaluation) cho GreenScan
# 10 nguyên tắc Nielsen (H01–H10) + 8 nguyên tắc riêng cho AI hỗ trợ kiểm toán (A01–A08). LABELING_GUIDE.md §5.


  quy_uoc_quan_sat: >-
    Trường quan_sat_so_bo ghi điều đã thấy trên ảnh chụp 15/10/2026 hoặc trong mã/đầu ra ngày 04/11/2026, kèm nguồn.
    Mức gợi ý trong đó là của người soạn (một người, mô phỏng chuyên gia); phải có ít nhất 2 người chấm độc lập
    theo PROTOCOL.md mới đưa vào danh sách vấn đề chính thức.

thang_muc_do_nielsen:
  yeu_to_can_nhac: ["tần suất: bao nhiêu người, bao nhiêu lần gặp", "tác động: khó vượt qua đến đâu", "độ dai dẳng: gặp một lần rồi quen hay lặp lại mãi"]
  muc:
    0: "Không phải vấn đề khả dụng."
    1: "Chỉ thẩm mỹ — sửa nếu còn thời gian."
    2: "Vấn đề nhỏ — ưu tiên thấp."
    3: "Vấn đề lớn — quan trọng, ưu tiên cao."
    4: "Thảm hoạ — bắt buộc sửa trước khi phát hành."
  quy_uoc_greenscan:   # đề xuất của bộ này, Nhân duyệt
    - "Vấn đề có thể làm sai một kết luận ghi vào giấy làm việc (đọc chưa đủ bằng chứng thành vi phạm, gán quyết định của AI cho người, áp dụng quy tắc nháp, mất vết quyết định) chấm tối thiểu 3."
    - "Vấn đề khiến người dùng cáo buộc doanh nghiệp khi bằng chứng không đủ, hoặc làm quy tắc nội bộ đổi kết luận kiểm chứng, chấm 4."
    - "Mỗi vấn đề do ≥ 2 người chấm độc lập (≥ 3 nếu có); lấy trung bình; chênh ≥ 2 mức thì thảo luận rồi chấm lại."
    - "Điểm tốt (thiết kế đúng nguyên tắc) ghi mức 0 và từ khoá “điểm tốt” để giữ khi sửa giao diện."

nguyen_tac:

  # ---------------- 10 nguyên tắc Nielsen ----------------

  - id: H01
    ten: "Hiển thị trạng thái hệ thống"
    ten_goc: "Visibility of system status"
    nhom: nielsen
    cau_hoi_kiem:
      - "Người dùng có luôn biết phiên nào đang mở, đang ở bước nào của quy trình, hệ thống đang làm gì (đang phân tích, đã lưu, đang rà soát) không?"
      - "Sau mỗi thao tác (ghi quyết định, chấp nhận gợi ý, lưu phiên bản) giao diện có phản hồi ngay và đúng chỗ không?"
      - "Trạng thái chạy (ngoại tuyến, AI đám mây, LLM tắt) có hiện nhất quán giữa các màn không?"
    cach_kiem_tren_greenscan:
      - "Ảnh 03, 17, 21: khung “Phiên đang mở”, chip “Có dùng AI đám mây cho phần khó”."
      - "Ảnh 08: thanh trên Studio “Đang rà soát”, “LLM: tắt”, “Đã lưu”."
      - "T01: lúc chạy chỉ có “Đang chờ đến lượt…” / “Đang phân tích…”, không có tiến độ từng bước (UI_V2_REVIEW màn 4) — kiểm người dùng có biết phải chờ bao lâu."
      - "T07: ô “Đã chốt …/9” và các tab hàng đợi đổi ngay sau quyết định."
    thang_muc_do:
      0: "Trạng thái rõ ở mọi màn."
      1: "Nhãn trạng thái đúng nhưng khó thấy."
      2: "Phải đoán trạng thái hoặc tìm ở màn khác (ví dụ không chắc đã lưu)."
      3: "Trạng thái mâu thuẫn giữa hai màn làm hiểu sai việc dữ liệu có rời máy hay quyết định đã ghi hay chưa."
      4: "Quyết định đã ghi mà giao diện không phản ánh, dẫn tới ghi trùng hoặc nộp giấy làm việc thiếu."
    quan_sat_so_bo:
      - "Chip đầu trang “Có dùng AI đám mây cho phần khó” (ảnh 03, 17, 21) hiện cùng lúc Studio ghi “LLM: tắt” (ảnh 08, lớp “B · Nội bộ”). Có lý do (lớp B không leo thang lên API, quyết định 14/10 §5.3) nhưng không giải thích tại chỗ. Gợi ý mức 2."
      - "Điểm tốt: ảnh 17 nói rõ “Mới chốt 0/9 … mục chưa xem sẽ ghi “chưa xem””. Mức 0."
    lien_ket: {nhiem_vu: [T01, T02, T07, T15], lint: [UXL-12]}
    review_status: pending_human_review

  - id: H02
    ten: "Khớp với thế giới thực (từ vựng kiểm toán)"
    ten_goc: "Match between system and the real world"
    nhom: nielsen
    cau_hoi_kiem:
      - "Nhãn có dùng từ của kiểm toán viên (giấy làm việc, người soát xét, cơ sở dẫn liệu: phân loại, chính xác, đúng kỳ, đầy đủ) thay vì từ của đội phát triển (BM25, RRF, τ, rule pack, claim_type) không?"
      - "Con số hiển thị có kèm nghĩa không (63/90 là điểm ưu tiên; 92 % là độ khớp từ khoá, không phải độ tin cậy của kết luận)?"
      - "Thuật ngữ tiếng Anh có được thay hoặc giải nghĩa không?"
    cach_kiem_tren_greenscan:
      - "Ảnh 05: dòng “nguồn internal · khớp từ khóa 92 % · ngữ nghĩa 37 %” dưới mỗi đoạn bằng chứng."
      - "Ảnh 03: “63/90” cạnh nút “Mở”, không nhãn."
      - "Ảnh 08: “τ chưa hiệu chỉnh (thí nghiệm B6): không leo thang”."
      - "Đối chiếu nhãn nút với PRODUCTION_UI_SPEC Phụ lục A; chạy UXL-02, UXL-03."
    thang_muc_do:
      0: "Từ ngữ quen với kiểm toán viên."
      1: "Một từ tiếng Anh quen trong nghề (Scope 1, tCO2e) chưa giải nghĩa."
      2: "Thuật ngữ nội bộ lộ ra màn hình (τ, thí nghiệm B6, internal, claim_type)."
      3: "Con số dễ bị đọc thành độ tin cậy của kết luận, ảnh hưởng quyết định."
      4: "Nhãn khiến người dùng hiểu ngược kết luận."
    quan_sat_so_bo:
      - "Ảnh 05: “nguồn internal” và hai phần trăm truy xuất đặt sát đoạn bằng chứng, dễ đọc thành “độ tin cậy 92 %”. Gợi ý mức 2–3, cần kiểm bằng T04."
      - "Ảnh 08: “τ chưa hiệu chỉnh (thí nghiệm B6)” là ngôn ngữ nội bộ. Gợi ý mức 2."
      - "[TỪ MÃ] DecisionBar.jsx: nút “Abstain” tiếng Anh; Phụ lục A định nhãn “Chưa đủ để kết luận”. Gợi ý mức 2."
      - "[ĐÃ ĐO 04/11] result.json phiên demo: 156/156 legal_checks.notes chứa định danh mã (ví dụ claim_type 'biodiversity', rule pack 'vn-green-v0.1-draft'); 1404/1404 lý do thành phần rủi ro là câu tiếng Anh (ví dụ “Claim specificity and identifiable metric.”; 58 câu có cả định danh mã như “Applicable boundary: ghg_scope_1_2_3.”). Mức tuỳ việc chuỗi có hiện trên giao diện [CHƯA XÁC MINH]."
    lien_ket: {nhiem_vu: [T03, T04, T06, T15], lint: [UXL-02, UXL-03]}
    review_status: pending_human_review

  - id: H03
    ten: "Người dùng kiểm soát và tự do"
    ten_goc: "User control and freedom"
    nhom: nielsen
    cau_hoi_kiem:
      - "Có thoát, quay lại, hoàn tác ở mọi bước không (Ctrl+Z, khôi phục phiên bản, Mở lại quyết định, đóng khung xem nguồn)?"
      - "Rời Studio về hàng đợi có giữ vị trí, bộ lọc không?"
      - "Có bị ép đi theo một thứ tự cứng không?"
    cach_kiem_tren_greenscan:
      - "T05 (đóng khung nguồn quay lại đúng thẻ), T08 (Mở lại), T10 (khôi phục phiên bản)."
      - "Ảnh 08: “← Hàng đợi”, “Lưu phiên bản”, khung dưới “Phiên bản (0)”."
    thang_muc_do:
      0: "Mọi thao tác đều có đường lui rõ."
      1: "Đường lui có nhưng phải tìm."
      2: "Quay lại làm mất vị trí hoặc bộ lọc."
      3: "Một thao tác quan trọng không hoàn tác được nhưng còn vết để làm lại bằng tay."
      4: "Mất công việc hoặc mất quyết định không lấy lại được."
    quan_sat_so_bo:
      - "Điểm tốt [TỪ MÃ]: hộp xác nhận chấp nhận hàng loạt nói rõ cách hoàn tác (“Ctrl+Z hoặc khôi phục một phiên bản đã lưu”). Mức 0."
    lien_ket: {nhiem_vu: [T02, T05, T08, T10], lint: []}
    review_status: pending_human_review

  - id: H04
    ten: "Nhất quán và tuân chuẩn"
    ten_goc: "Consistency and standards"
    nhom: nielsen
    cau_hoi_kiem:
      - "Một khái niệm có đúng một tên trên mọi màn không (cùng enum thì cùng nhãn)?"
      - "Số bước quy trình có khớp giữa thanh bên, nút và tiêu đề không?"
      - "Cùng một đại lượng có cùng con số ở mọi nơi hiển thị không?"
    cach_kiem_tren_greenscan:
      - "So nhãn trên ảnh 03, 05, 08, 17 với PRODUCTION_UI_SPEC Phụ lục A."
      - "So số thuộc tính thiếu ở chip hàng đợi với lý do ưu tiên và tab Thuộc tính; chạy UXL-12."
    thang_muc_do:
      0: "Nhất quán."
      1: "Khác biệt nhỏ về chữ, không đổi nghĩa."
      2: "Cùng khái niệm hai tên, hoặc số bước lệch, làm người dùng chần chừ."
      3: "Hai con số khác nhau cho cùng đại lượng ở hai màn, người dùng không biết tin số nào khi ghi giấy làm việc."
      4: "Cùng nhãn mang hai nghĩa trái nhau."
    quan_sat_so_bo:
      - "Đánh số bước lệch: thanh bên “3 Sửa báo cáo (Studio)”, “4 Giấy làm việc”; nút ở hàng đợi “Bước 3 · Xuất →” (ảnh 03); thẻ ở màn giấy làm việc “BƯỚC 3 · GIẤY LÀM VIỆC” (ảnh 17). Gợi ý mức 2."
      - "Cùng kết luận PARTIALLY_SUPPORTED: “Ủng hộ một phần” (ảnh 03, đúng Phụ lục A) và “Khớp một phần” (Inspector ảnh 08). Gợi ý mức 2."
      - "“Cần soát (9)” ở hàng đợi và “Cần xem 146” trong Studio là hai tập khác nhau với tên gần giống. Gợi ý mức 2."
      - "[ĐÃ KIỂM 04/11] Chip hàng đợi ghi “thiếu 3/5 thuộc tính”, “2/5”, “1/5” cho mục #1–#3 (ảnh 03), còn lý do ưu tiên trong result.json cùng phiên ghi “thiếu 4/5”, “3/5”, “2/5”. Nguyên nhân [CHƯA XÁC MINH] (có thể khác cách đếm “thiếu” với “một phần”). Gợi ý mức 2, lên 3 nếu cả hai con số cùng hiện ra cho người dùng."
    lien_ket: {nhiem_vu: [T03, T04, T11, T15], lint: [UXL-12]}
    review_status: pending_human_review

  - id: H05
    ten: "Phòng lỗi"
    ten_goc: "Error prevention"
    nhom: nielsen
    cau_hoi_kiem:
      - "Thao tác rủi ro (chấp nhận hàng loạt, khôi phục văn bản gốc, xuất khi còn mục chưa soát, ghi đè không lý do) có bước xác nhận hoặc ràng buộc không?"
      - "Tài liệu bằng chứng có bị khoá không cho sửa không?"
      - "Có chặn dữ liệu nhập sai (tên người soát xét rỗng, ghi đè thiếu trạng thái) không?"
    cach_kiem_tren_greenscan:
      - "Ảnh 08: tài liệu bằng chứng ghi “Bằng chứng · chỉ đọc”, có biểu tượng khoá."
      - "Ảnh 17: cảnh báo khi còn mục chưa chốt."
      - "[TỪ MÃ] DecisionBar.jsx: nút bị vô hiệu khi tên người xem xét rỗng; ô lý do chỉ “khuyến nghị”."
    thang_muc_do:
      0: "Lỗi bị chặn từ trước."
      1: "Có cảnh báo nhưng dễ bỏ qua với lỗi vô hại."
      2: "Lỗi dễ mắc nhưng sửa được ngay."
      3: "Lỗi làm hỏng vết kiểm toán (quyết định không lý do, sửa nhầm hàng loạt) mà không bị chặn."
      4: "Lỗi làm sai kết luận đã phát hành mà không có cảnh báo."
    quan_sat_so_bo:
      - "[TỪ MÃ] Lý do quyết định là tuỳ chọn với cả Ghi đè, Abstain, Yêu cầu thêm bằng chứng (DecisionBar.jsx, placeholder “khuyến nghị”), trong khi HUMAN_REVIEW_SPEC.md §3.3 yêu cầu bắt buộc với quyết định không chấp nhận. Gợi ý mức 3 vì ảnh hưởng vết kiểm toán."
      - "Điểm tốt: giấy làm việc vẫn in được khi còn mục chưa xem nhưng có cảnh báo và ghi “chưa xem” (ảnh 17). Mức 0."
    lien_ket: {nhiem_vu: [T01, T07, T10, T13, T14], lint: [UXL-09]}
    review_status: pending_human_review

  - id: H06
    ten: "Nhận ra hơn là nhớ lại"
    ten_goc: "Recognition rather than recall"
    nhom: nielsen
    cau_hoi_kiem:
      - "Người dùng có phải nhớ thông tin từ màn trước (trang, mã tuyên bố, quyết định đã ghi) không?"
      - "Nghĩa của nhãn, lựa chọn, phím tắt có hiện tại chỗ (tooltip, chú giải) không?"
    cach_kiem_tren_greenscan:
      - "Ảnh 14 (thẻ di chuột), ảnh 15 (hướng dẫn lần đầu), nút “Phím tắt” (ảnh 08)."
      - "Ảnh 03: dòng chú thích “Thứ tự là thứ tự nên mở, không phải mức độ “xấu”.”"
      - "T06, T16: tìm lại một tuyên bố cụ thể có cần nhớ số trang không."
    thang_muc_do:
      0: "Thông tin cần có ngay tại chỗ."
      1: "Phải rê chuột mới thấy nghĩa của nhãn phụ."
      2: "Phải nhớ thông tin từ màn khác để làm tiếp."
      3: "Phải nhớ thông tin then chốt (ví dụ trang nguồn) để ghi giấy làm việc."
      4: "Không có cách tra lại thông tin đã thấy."
    quan_sat_so_bo:
      - "Điểm tốt: chú thích thứ tự hàng đợi và ô “Độ phủ kho tài liệu 75 % — chưa đủ để kết luận vắng bằng chứng” (ảnh 03) nói nghĩa ngay tại chỗ. Mức 0."
    lien_ket: {nhiem_vu: [T02, T06, T12, T16], lint: []}
    review_status: pending_human_review

  - id: H07
    ten: "Linh hoạt và hiệu quả"
    ten_goc: "Flexibility and efficiency of use"
    nhom: nielsen
    cau_hoi_kiem:
      - "Người dùng thạo có lối tắt (F8 / Shift+F8, Ctrl+., Ctrl+Enter, chấp nhận hàng loạt, bộ lọc) không?"
      - "Đi từ hàng đợi → bằng chứng → quyết định mất bao nhiêu thao tác?"
      - "Việc cấu hình có cần kỹ năng kỹ thuật không?"
    cach_kiem_tren_greenscan:
      - "Đếm số bấm tối thiểu theo duong_di_mong_doi của T04, T07, T09."
      - "So thời gian lần đầu và lần thứ hai cùng nhiệm vụ (nếu buổi thử có lặp)."
      - "Ảnh 21: mục “Đổi chế độ”."
    thang_muc_do:
      0: "Có cả đường cho người mới và lối tắt cho người thạo."
      1: "Thiếu lối tắt cho thao tác ít dùng."
      2: "Thao tác lặp nhiều lần mà không có cách làm nhanh."
      3: "Việc thường xuyên cần kỹ năng kỹ thuật (sửa tệp, khởi động lại)."
      4: "Không làm được việc nếu không có lập trình viên."
    quan_sat_so_bo:
      - "Ảnh 21: đổi chế độ chạy phải đặt QUANTUM_PROFILE trong .env và khởi động lại. Hợp lý với người quản trị, không hợp với kiểm toán viên. Gợi ý mức 1–2."
    lien_ket: {nhiem_vu: [T09, T10, T15, T16], lint: []}
    review_status: pending_human_review

  - id: H08
    ten: "Thẩm mỹ và tối giản"
    ten_goc: "Aesthetic and minimalist design"
    nhom: nielsen
    cau_hoi_kiem:
      - "Mỗi màn có xoay quanh một quyết định không; có thông tin thừa cạnh tranh với bằng chứng không?"
      - "Điểm rủi ro có bị phóng to thành tiêu đề không (P5)?"
      - "Văn bản lặp lại có làm loãng thông tin phân biệt không?"
    cach_kiem_tren_greenscan:
      - "Ảnh 03 (bốn ô số liệu), ảnh 05 (thẻ bằng chứng), ảnh 16 (chế độ tập trung)."
    thang_muc_do:
      0: "Gọn, đúng trọng tâm."
      1: "Một vài chi tiết thừa."
      2: "Thông tin lặp làm khó tìm điều khác biệt."

version: pipeline-v1
language: vi
runs_dir: .quantum/runs

intake:
  chunk_size_chars: 1400
  chunk_overlap_chars: 180
  min_native_text_chars: 40
  extract_tables: true
  ocr_enabled: true
  ocr_languages: vie+eng
  tesseract_command: tesseract

claim_extraction:
  provider: heuristic
  minimum_confidence: 0.40
  include_vague_claims: true

retrieval:
  top_k: 5
  candidate_k: 30
  fusion: rrf          # rrf | weighted — RRF only reorders; scores stay weighted
  rrf_k: 60
  lexical_weight: 0.55
  semantic_weight: 0.45
  minimum_score: 0.12
  exclude_same_chunk: true

embedding:
  provider: lite       # lite (no download) | local (BAAI/bge-m3) | http (TEI)
  model: BAAI/bge-m3
  device: cuda
  batch_size: 16
  base_url: ""

reranker:
  provider: none       # none | local (BAAI/bge-reranker-v2-m3) | http (TEI /rerank)
  model: BAAI/bge-reranker-v2-m3
  device: cuda
  base_url: ""
  candidate_k: 30
  final_k: 5

verification:
  numeric_relative_tolerance: 0.12
  strong_support_score: 0.46
  partial_support_score: 0.22
  injection_policy: exclude

scoring:
  rubric_file: configs/scoring_v1.yaml

review:
  high_risk_threshold: 50
  critical_risk_threshold: 75
  require_human_for_legal_conflict: true

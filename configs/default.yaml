version: pipeline-v1
language: vi
runs_dir: .quantum/runs

intake:
  chunk_size_chars: 600
  chunk_overlap_chars: 0
  max_sentences_per_chunk: 3
  min_native_text_chars: 40
  extract_tables: true
  ocr_enabled: true
  ocr_languages: vie+eng
  tesseract_command: tesseract

claim_extraction:
  provider: heuristic
  minimum_confidence: 0.40
  include_vague_claims: true

retrieval:
  top_k: 5
  candidate_k: 30
  fusion: rrf          # rrf | weighted — RRF only reorders; scores stay weighted
  rrf_k: 60
  lexical_weight: 0.55
  semantic_weight: 0.45
  minimum_score: 0.12
  floor_k: 3           # always keep this many best candidates, marked below_threshold
  exclude_same_chunk: true

embedding:
  provider: lite       # lite (no download) | local (BAAI/bge-m3) | http (TEI)
  model: BAAI/bge-m3
  device: cuda
  batch_size: 16
  base_url: ""

reranker:
  provider: none       # none | local (BAAI/bge-reranker-v2-m3) | http (TEI /rerank)
  model: BAAI/bge-reranker-v2-m3
  device: cuda
  base_url: ""
  candidate_k: 30
  final_k: 5

verification:
  numeric_relative_tolerance: 0.10   # cap on precision-derived tolerance (precision-v1), not a global tolerance
  numeric_contradiction_error: 0.35  # comparable figures this far apart contradict; hypothesis to sweep on numeric-pair gold (ISSUES N1)
  support_min_attributes: 2       # cue-only support needs >= 2 matched claim attributes to be SUPPORTED (ISSUES N4; sweep on gold)
  strong_support_score: 0.46
  partial_support_score: 0.22
  injection_policy: exclude
  qualitative_min_overlap: 0.20   # authority sources bypass this; see settings.py
  llm_stance: "off"               # quoted: bare `off` is YAML boolean false
                                  # "off" | "on_ambiguous" — see verification/llm_judge.py
  llm_stance_min_overlap: 0.12

scoring:
  rubric_file: configs/scoring_v1.yaml

# Thứ tự soát: câu nào nên mở trước (configs/priority_v1.yaml)
priority_policy: configs/priority_v1.yaml

review:
  # high_risk_threshold / critical_risk_threshold used to live here and were read
  # by nothing: the scorer had its own hardcoded ladder. Severity bands now come
  # from the `severity:` block of the rubric file above, and from nowhere else.
  require_human_for_legal_conflict: true

legal:
  enabled: true
  registry_file: configs/legal/LEGAL_SOURCE_REGISTRY.yaml
  rule_pack_file: configs/legal/rule_pack_vn_green_v0.1.yaml
  # historical_compliance | current_policy_alignment — different questions, kept
  # apart deliberately; see src/quantum_gw/legal/corpus.py
  check_mode: current_policy_alignment

# Task-level provider routing for the Model Gateway (v1.1 local-first).
#
# primary/fallback name a provider from the registry:
#   local | ollama | fpt | gemini | openai | anthropic | openrouter
# Special targets:
#   deterministic — the task must be solved by Python, never an LLM
#   none          — no fallback; fail fast instead of silently switching provider
#
# `models:` picks the model per provider for that task. One FPT endpoint serves
# a dozen models, and these tasks have genuinely different cost/quality needs, so
# the model belongs to the task rather than to the provider. Keyed by provider so
# a fallback hop still names a model that provider actually hosts.
#
# Models confirmed available on this account's FPT Marketplace (2026-08-08):
#   chat/reasoning : GLM-5.2, DeepSeek-V4-Flash, gpt-oss-120b, gpt-oss-20b,
#                    Llama-3.3-70B-Instruct, Qwen3.6-27B, gemma-4-31B-it,
#                    gemma-4-26B-A4B-it, gemma-3-27b-it
#   vision         : Qwen2.5-VL-7B-Instruct
#   embedding      : Vietnamese_Embedding, multilingual-e5-large
#   reranking      : bge-reranker-v2-m3
#   speech         : whisper-large-v3-turbo, FPT.AI-whisper-medium,
#                    FPT.AI-whisper-large-v3-turbo, FPT.AI-VITs
#
# These assignments are a starting hypothesis, not a measured result. Validate
# with `quantum-agent evaluate` per docs/04-data-ai/ACCURACY_IMPROVEMENT_PLAYBOOK.md before
# treating any of them as settled.

routing:
  # High volume, structured JSON out, runs over every chunk. Favour a fast mid
  # model; a frontier model here costs a lot and buys little.
  claim_extraction:
    primary: local
    fallback: fpt
    models:
      fpt: Qwen3.6-27B

  # Mostly schema-filling from text already extracted. Same reasoning.
  claim_normalization:
    primary: local
    fallback: fpt
    models:
      fpt: Qwen3.6-27B

  # Short prompts, latency-sensitive, fires per retrieval round.
  retrieval_query_generation:
    primary: local
    fallback: fpt
    models:
      fpt: DeepSeek-V4-Flash

  # Units, base years, ratios and trends. A language model must not arbitrate
  # arithmetic — this stays in Python and has no fallback by design.
  quantitative_verification:
    primary: deterministic
    fallback: none

  # Stance of one passage towards one claim, reached only when the cue lexicon
  # and the numeric comparison both declined. Never decisive on its own: every
  # answer is marked for human review. Reasoning quality matters more than
  # latency here because it only fires on the residual hard cases.
  qualitative_stance:
    primary: local
    fallback: fpt
    models:
      fpt: GLM-5.2

  # The hardest task: map a claim onto QD 21/2025, TT 17/2022, NĐ 06/2022 while
  # preserving scope and qualifiers. Worth the largest available model.
  legal_reasoning:
    primary: fpt
    fallback: local
    models:
      fpt: GLM-5.2

  # Vietnamese prose quality matters and volume is low (one per run).
  final_report:
    primary: fpt
    fallback: local
    models:
      fpt: Llama-3.3-70B-Instruct

  # Scanned pages, chart images and complex table layouts. Only reached when the
  # text-layer check says a page is not machine-readable.
  document_vision:
    primary: fpt
    fallback: none
    models:
      fpt: Qwen2.5-VL-7B-Instruct

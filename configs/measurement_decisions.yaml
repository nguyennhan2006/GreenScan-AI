# Pre-registered decision rules for the gold measurement.
#
# Written 2026-09-29, BEFORE any gold label existed. tools/measure_all.py reads
# this file and prints, for each rule, the measured value, the threshold and the
# resulting decision. Changing a threshold after seeing the numbers defeats the
# point: if one must change, add a new version below and say why in
# docs/00-project/DECISIONS_LOG.md.
#
# Sources: RESEARCH_PROGRAM_2026-09-22.md (RQ4, RQ5, RQ7), DECISIONS_LOG
# D-2026-09-22-05 (no accuracy claims below 60 gold), D-2026-09-28-01 (stance
# model guard), COLLECTION_PLAN_v2 §6 (queue gate).

version: measurement-decisions-v1
registered: 2026-09-29
# Same day, still before any gold: retrieval variants re-cut after measuring
# this laptop's CPU (BGE-M3 0.49 pages/s, bge-reranker 0.28 pairs/s). Dense and
# rerank are measured through FPT (Vietnamese_Embedding = bge-m3 fine-tune per
# its model card; bge-reranker-v2-m3 unchanged); local BGE-M3 only when its
# vectors were computed beforehand. Thresholds unchanged.

gates:
  # Below these, numbers are internal only: nothing is said to the jury.
  kappa_min: 0.70                 # RQ7, Round-1 commitment; on is_claim and verdict
  gold_rows_for_accuracy_claims: 60   # D-2026-09-22-05

decisions:
  dense_default:                  # RQ4, one row per dense variant measured
    question: "Bật truy xuất dense làm mặc định?"
    candidates: [vn-embedding, bge-m3-local]
    baseline: lite
    metric: recall@5
    min_delta: 0.10               # +10 points
    max_time_ratio: 2.0           # seconds per claim at query time, variant / lite
  reranker_claim:                 # RQ5
    question: "Được nói 'reranker giúp'?"
    compare: [vn-embedding+rerank, vn-embedding]
    metric: verdict_accuracy      # end to end, not ranking alone
    min_delta_ci_low: 0.0         # the paired difference must be > 0
  stance_model_keep_on:           # D-2026-09-28-01
    question: "Giữ mô hình xét quan hệ (có chốt chặn)?"
    metric: pair accuracy, model vs rules on the pairs the model decided
    min_delta_ci_low: 0.0
  lift_guard_supports:
    question: "Cho mô hình tự quyết SUPPORTED?"
    metric: precision of SUPPORTS decided by the model
    min_precision: 0.80
    min_ci_low: 0.65
    min_n: 20
  lift_guard_contradicts:
    question: "Cho mô hình tự quyết CONTRADICTED?"
    metric: precision of CONTRADICTS decided by the model
    min_precision: 0.90
    min_ci_low: 0.75
    min_n: 10
    # and the decisive verifier may not raise the false-contradiction rate
    max_false_contradiction_rate_increase: 0.0
  claim_filter_needed:            # COLLECTION_PLAN_v2 §6 gate
    question: "Cần bộ lọc tuyên bố bằng LLM (việc D)?"
    metric: share of queue rows a human called a claim
    build_if_below: 0.70

# ---------------------------------------------------------------------------
# model-selection-v2 — registered 2026-10-16, BEFORE any of these candidates was
# measured on the new label sets (T1 ~2,550 Claude labels; ~800 Claude-labelled
# claim–passage pairs for steps 6–7). v1 above is untouched and still governs
# human gold. Why a new block: DECISIONS_LOG D-2026-10-16-01.
#
# Common rules
#   - Labels are Claude's (two blind passes, adjudication, blind audit). Every
#     number is reported as "nhãn Claude, chưa phải gold"; human gold, when it
#     exists, re-runs the same rules and wins. Claude labels never lift a guard.
#   - Intervals: 95% bootstrap resampling whole companies; comparisons are
#     paired (same items). "Better" = lower bound of the paired Δ > 0.
#     "Not worse" = the interval of Δ contains 0 or lies above it.
#   - One stage changes at a time (TARGET_PIPELINE_AND_TRAINING §6).
#   - Among candidates not worse than the best, pick the cheapest to run:
#     offline before cloud, smaller before larger, faster before slower.
model_selection_v2:
  registered: 2026-10-16
  # measured for reference on public reports only; never chosen for a task that touches user
  # documents (data region Japan, D-2026-10-06-05)
  ineligible_for_user_documents: [Qwen3.6-27B, DeepSeek-V4-Flash]
  label_quality:
    t1_kappa_claim_min: 0.80        # Claude pass A vs B, claim / not claim
    t1_audit_agreement_min: 0.80    # blind audit vs adjudicated decision
    pairs_kappa_relation_min: 0.60  # below: steps 6–7 numbers are exploratory only
    claude_vs_human_kappa_min: 0.60 # plan v3 A2, once human lots exist
  t1_claim_detection:               # step 4
    candidates_offline: [rules, e5-small, e5-base, e5-large, bge-m3, qwen3-0.6b-cls, zero-shot-nli]
    candidates_cloud: [GLM-5.2, gemma-4-31B-it, gemma-4-26B-A4B-it, Qwen3.6-27B, Llama-3.3-70B-Instruct, DeepSeek-V4-Flash]
    primary: macro_f1_4class_company_cv   # QUANT / QUAL / VAGUE / NOT, out-of-company folds
    secondary: [claim_f1, claim_recall, compare_set_macro_f1, ece]
    offline_limits: {cpu_ms_per_sentence_max: 50, ram_gb_max: 2.0}   # plan v3 B7, i7-1355U
    pick_offline: "smallest model not worse than the best offline model and within 0.02 of it"
    replace_rules_if: "student − rules: lower bound > 0, and claim recall ≥ rules + 0.10"   # plan v3 B1
    use_llm_in_cloud_if: "LLM − chosen student: lower bound > 0 on the compare set"
  normalization:                    # step 5
    status: deferred                # no attribute labels yet; regex + taxonomy stays, no accuracy claim
  retrieval:                        # step 6
    candidates: [bm25, lite, dense-vn, hybrid-vn, lite+rerank, hybrid-vn+rerank]
    today: lite
    primary: recall@5               # relevance 2 = a passage an auditor would cite; claims with ≥ 1 such passage
    secondary: [ndcg@5, mrr@5, seconds_per_claim]
    pool: "top-5 of every candidate labelled, so k ≤ 5 metrics are exact"
    switch_default_if: "Δrecall@5 vs lite ≥ +0.10 and lower bound > 0 and time ratio ≤ 2.0"   # = v1 dense_default
    offline_profile_candidates: [bm25, lite]   # FPT models send text out: cloud profile only
    keep_reranker_if: "Δndcg@5 vs the same system without reranker: lower bound > 0 (ranking only; v1 reranker_claim still needs verdict accuracy on gold)"
  stance:                           # step 7
    candidates: [rules, GLM-5.2, gemma-4-31B-it, gemma-4-26B-A4B-it, Llama-3.3-70B-Instruct, Qwen3.6-27B, DeepSeek-V4-Flash, nli-mdeberta]
    today: GLM-5.2                  # guarded: llm_stance_decisive false
    primary: macro_f1_4relation     # SUPPORTS / PARTIAL / CONTRADICTS / CONTEXT, non-contested pairs
    safety: [precision_contradicts, false_contradicts_per_100, precision_supports]
    replace_today_if: "X − GLM-5.2 macro-F1 lower bound > 0; or X not worse on macro-F1, not more false CONTRADICTS per 100, and ≥ 2× cheaper or ≥ 2× faster per pair"
    offline_candidate_counts_if: "nli-mdeberta − rules macro-F1 lower bound > 0 (offline profile only)"
    lift_guard: "never on Claude labels; v1 lift_guard_* on human gold"

agentic_v1:
  registered: 2026-10-31   # before any AG-1 model output was seen; rules baseline and gold-IR oracle were known
  plan: docs/00-project/KE_HOACH_AGENT_KAGGLE_LUAN_VAN_2026-10-31.md
  bench: benchmark/gs_bench_v1/gs_bench_v1.jsonl   # 51 constructed (B-a) + 142 generated from real sentences (B-b)
  label_status: "B-a constructed truth; B-b truth by perturbation family over evidence IR read by Claude + deterministic checks (silver)"
  known_before_registration:
    rules_B-b: {coverage: 0.028, precision: 0.75, false_S: 1, false_C: 0}
    gold_ir_oracle_B-b: {coverage: 0.528, precision: 1.0, false_S: 0, false_C: 0}
  metrics: [coverage, precision_on_decided, false_S, false_C]   # per layer; B-b CI by company bootstrap, 2000 resamples
  gates:
    ag1_ir_path_usable:          # the IR + irlib path goes on to AG-2 when, on B-b:
      precision_min: 0.90
      precision_ci95_low_min: 0.80
      false_C_max_over_rules: 1
    ag2_dual_path_to_product:    # reviewer aid behind QUANTUM_VERIFY=dual (user decision 31/10), checked 06/11
      false_C_not_above: rules
      false_S_not_above: rules
      coverage_gain_ci95_low_gt: 0
      green_traps: 17/17
      invariant_tests: all
      hpg_offline_runtime_max_ratio: 2.0
  predictions_ag1:
    q3-4b-inst: "B-b coverage >= 0.35 with precision >= 0.90 and false_C <= 2; B-a sạch right >= 26/32"
    q3-1.7b: "coverage at least 0.10 below q3-4b-inst"
    q3-0.6b: "unusable: coverage < 0.15 or precision < 0.80"
    q3-8b_q3-14b-awq_gemma3-12b: "within +-0.05 coverage of q3-4b-inst (no size effect above ~4B)"


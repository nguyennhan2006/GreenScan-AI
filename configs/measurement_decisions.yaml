agentic_ag2_v1:
  registered: "2026-10-31 23:40"   # before any AG-2 policy was computed on run G; per-path G results WERE known (see known_before)
  worth_check:
    failure: "F2 rule coverage: rules decide 0.6-7.7 % of B-b cases"
    decision: "gate ag2_dual_path_to_product (06/11): may QUANTUM_VERIFY=dual show an IR verdict to the reviewer"
    cost: "CPU only, 0 GPU hours, about 2M tokens"
  known_before: "run G per path (v1.2): rules 0.006 / 1.0 / fS 0 / fC 0; 4B 0.093 / 1.0 / 0 / 0; 8B 0.068 / 0.909 / 1 / 0; 14B 0.086 / 0.929 / 1 / 0; 32B 0.228 / 0.973 / 1 / 0"
  script: experiments/AG-2/policies.py
  cal_set: "GS-Bench v1.1 B-b cases every model read (388; v1.2 readings, out/v11_v12); rules = experiments/AG-0/out/rules.jsonl"
  test_set: "run G, gs_heldout_v12.jsonl (162); secondary: the 102 non-other_env cases (post hoc subset, reported apart)"
  configs:
    rules+4b: "product-sized: one small reader"
    rules+32b: "one large reader (Groq hosts qwen3-32b; 32B is biased on G by construction)"
    rules+4ir: "4B, 8B, 14B, 32B: research upper bound, not a product option"
  policies:
    union: "decisive labels of all paths agree -> that label, else N"
    union_noloneS: "as union, but an S given by the rules path alone -> N (rules-alone S was right 1/6 on run D held-out)"
    bucket: "union_noloneS label kept when P(right | bucket) on cal_set has a 2.5 % Beta(k+1, n-k+1) bound > 0.90 (C) / 0.80 (S); bucket = (rules label, union label, number of IR paths giving it)"
  predictions_on_G:
    rules+4b_union_noloneS: "false_C 0, false_S 0, coverage >= 0.09, coverage gain over rules CI95 low > 0 (the statistical part of the gate passes)"
    rules+4b_bucket: "coverage <= union_noloneS, false_C 0"
    rules+4ir_union_noloneS: "coverage >= 0.15 with false_C <= 1"
  falsified_if: "rules+4b union_noloneS has false_C > 0 or false_S > 0 on G -> no IR verdict reaches the reviewer before 06/11"
  gate_parts_not_tested_here: "green_traps 17/17, invariant tests, HPG offline runtime <= 2.0x: need the reader inside the product (none of Qwen3-4B..32B runs in the offline profile today)"
  result_2026-10-31_23h50:   # experiments/AG-2/out/ag2v1_rules_{4b,32b,4ir}.json; cov / prec / false_S / false_C / coverage gain over rules CI95
    cal_rules: "0.059 / 0.652 / 8 / 0"
    test_rules: "0.006 / 1.0 / 0 / 0"
    rules+4b_union_noloneS: {cal: "0.242 / 0.989 / 1 / 0 / [0.065, 0.353]", test: "0.093 / 1.0 / 0 / 0 / [0.016, 0.185]"}
    rules+4b_bucket: {cal: "0.222 / 0.988 / 1 / 0", test: "0.093 / 1.0 / 0 / 0 / [0.016, 0.185]", kept_buckets: "N/C/1, N/S/1 (4B decides, rules silent)"}
    rules+4b_union: {test: "0.099 / 1.0 / 0 / 0", cal: "0.278 / 0.926 / 8 / 0 (rules-alone S)"}
    rules+32b_union_noloneS: {cal: "0.369 / 0.986 / 2 / 0", test: "0.228 / 0.973 / 1 / 0 (biased set)"}
    rules+4ir_union_noloneS: {cal: "0.459 / 0.961 / 6 / 1", test: "0.247 / 0.95 / 2 / 0"}
    rules+4ir_bucket: "keeps only 4-of-4 agreement: test 0.037, gain CI low < 0"
    verdict: "All three predictions HELD; not falsified. rules+4b union_noloneS passes the statistical part of ag2_dual_path_to_product on G (false_C 0 <= 0, false_S 0 <= 0, gain CI low 0.016 > 0) and on cal (false_S 1 <= 8). rules+32b and rules+4ir fail it on G (false_S 1 and 2 > 0). Dropping the rules-alone S is what makes the dual path safe: union keeps rules' 8 false_S on cal."
    caveat: "G decided cases are few (15 for 4B): the safety evidence on new companies is 15 / 15 right, not a tight bound"
    next: "the remaining gate parts need the reader inside the product: no Qwen3 reader runs in the offline profile today"

